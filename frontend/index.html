<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>iX</title>
    <!--
    When deploying the frontend separately (e.g. on Vercel), set this meta tag
    to the public host of your backend, without protocol:
        <meta name="ix-backend" content="ix.yourdomain.com" />
    When the frontend is served by FastAPI itself, leave it empty/omitted.
  -->
    <meta name="ix-backend" content="159-65-13-68.sslip.io" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <div id="auth-overlay" class="auth-overlay">
      <form id="auth-form" class="auth-form" autocomplete="off">
        <div class="auth-brand">iX</div>
        <input
          id="auth-input"
          type="password"
          placeholder="access token"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit">enter</button>
        <div id="auth-error" class="auth-error"></div>
      </form>
    </div>

    <header style="display: none">
      <div class="brand">iX</div>
      <div class="controls">
        <select id="symbol"></select>
        <div class="tfs" id="tfs"></div>
        <div class="status" id="status">disconnected</div>
      </div>
      <div class="header-mid">
        <button id="my-trades-btn" class="trades-btn">My Trades <span id="open-pos-count" class="pos-badge" hidden>0</span></button>
      </div>
      <div class="readout">
        <span class="lbl">price</span><span id="px">—</span>
        <span class="lbl">cvd</span><span id="cvd">—</span>
        <span class="lbl">delta</span><span id="delta">—</span>
        <span class="lbl">balance</span><span id="balance">—</span>
        <button id="liq-toggle" class="icon-btn" title="toggle liquidation heatmap" aria-pressed="false">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <rect x="1"  y="9"  width="2" height="5" rx="0.5"/>
            <rect x="4"  y="6"  width="2" height="8" rx="0.5"/>
            <rect x="7"  y="3"  width="2" height="11" rx="0.5"/>
            <rect x="10" y="7"  width="2" height="7" rx="0.5"/>
            <rect x="13" y="10" width="2" height="4" rx="0.5"/>
          </svg>
        </button>
        <button id="logout" class="logout" title="clear access token">
          logout
        </button>
      </div>
    </header>

    <div id="trades-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title">paper trading</span>
          <span class="modal-equity">
            <span class="lbl">balance</span><span id="modal-balance">—</span>
            <span class="lbl">equity</span><span id="modal-equity">—</span>
            <span class="lbl">unrealized</span><span id="modal-unrealized">—</span>
            <button id="reset-account" class="ghost-btn" title="reset account to $1000">reset</button>
          </span>
          <button class="modal-close" data-close="1" aria-label="close">×</button>
        </div>

        <div class="modal-section">
          <div class="trade-form">
            <div class="side-toggle">
              <button class="side-btn active" data-side="long">LONG</button>
              <button class="side-btn" data-side="short">SHORT</button>
            </div>
            <div class="form-row">
              <label class="form-field">
                <span>size (USD)</span>
                <input type="number" id="trade-size" value="100" min="1" step="10" />
              </label>
              <label class="form-field">
                <span>leverage <b id="lev-display">10x</b></span>
                <input type="range" id="trade-leverage" min="1" max="100" value="10" />
              </label>
            </div>
            <div class="trade-summary">
              <div><span class="lbl">margin</span><b id="trade-margin">$10.00</b></div>
              <div><span class="lbl">notional</span><b id="trade-notional">$100.00</b></div>
              <div><span class="lbl">est. liq</span><b id="trade-liq">—</b></div>
              <div><span class="lbl">mark</span><b id="trade-mark">—</b></div>
            </div>
            <button id="open-trade-btn" class="primary-btn long">OPEN LONG</button>
            <div id="trade-error" class="form-error"></div>
          </div>
        </div>

        <div class="modal-section">
          <div class="section-head">active positions <span id="active-count" class="muted">(0)</span></div>
          <div id="active-trades" class="trades-list"></div>
        </div>

        <div class="modal-section">
          <div class="section-head">history</div>
          <div id="trade-history" class="trades-list compact"></div>
        </div>
      </div>
    </div>
    <main style="display: none">
      <div id="price" class="pane"></div>
      <div id="cvd-pane" class="pane"></div>
      <div id="taker-pane" class="pane">
        <div class="taker-overlay">
          <div class="taker-legend">
            <span class="lg lg-5m">5m <b id="taker-5m">—</b></span>
            <span class="lg lg-15m">15m <b id="taker-15m">—</b></span>
            <span class="lg lg-1h">1h <b id="taker-1h">—</b></span>
          </div>
          <div class="taker-regime" id="taker-regime" data-regime="neutral">
            <span class="rg-text" id="taker-regime-text">—</span>
            <span class="rg-sub" id="taker-regime-sub"></span>
          </div>
        </div>
      </div>
      <div id="funding-pane" class="funding-pane">
        <div class="funding-stat">
          <div class="stat-lbl">funding</div>
          <div class="stat-val" id="fund-val">—</div>
          <div class="stat-sub" id="fund-countdown">next in —</div>
        </div>
        <div class="funding-stat">
          <div class="stat-lbl">open interest</div>
          <div class="stat-val" id="oi-val">—</div>
          <div class="stat-sub" id="oi-change">1h —</div>
        </div>
        <div class="funding-stat" id="basis-stat">
          <div class="stat-lbl">spot − perp</div>
          <div class="stat-val" id="basis-val">—</div>
          <div class="stat-sub" id="basis-sub">leader —</div>
        </div>
        <div class="funding-stat" id="gex-stat">
          <div class="stat-lbl">gex regime</div>
          <div class="stat-val" id="gex-val">—</div>
          <div class="stat-sub" id="gex-sub">flip —</div>
        </div>
        <div class="funding-stat funding-signal" id="funding-signal">
          <div class="stat-lbl">signal</div>
          <div class="signal-text" id="signal-text">NEUTRAL</div>
          <div class="stat-sub" id="signal-sub">no setup</div>
        </div>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
